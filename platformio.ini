; Glance for GeekMagic SmallTV Ultra (ESP8266 / ESP-12F) - Crypto & KR market ticker
; Build with: pio run
; Flash via USB: pio run -t upload   (hold GPIO0->GND on power-up for first flash)
; Or upload .pio/build/esp12e/firmware.bin through the stock web "Firmware Upgrade" page (no disassembly).

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.4
    tzapu/WiFiManager @ ^2.0.17
; ESP8266WebServer + ESP8266HTTPUpdateServer ship with the espressif8266 core.

; ---- TFT_eSPI configuration for the SmallTV Ultra's ST7789 240x240 panel ----
; Pins verified for GeekMagic Ultra (ESP8266): SCLK=14 MOSI=13 CS=15 DC=0 RST=2 BL=5
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=0
    -DTFT_RST=2
    -DTFT_BL=5
    -DTFT_BACKLIGHT_ON=LOW

    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000

; ============================================================================
;  GeekMagic SmallTV Pro (ESP32-WROOM-32) - same firmware, different hardware.
;  Build with: pio run -e esp32-pro
;  Flash: pio run -e esp32-pro -t upload  (UART, GPIO0->GND on power-up), or
;  upload .pio/build/esp32-pro/firmware.bin via the stock web "Firmware Update".
;
;  Pinout confirmed on real hardware with tools/esp32-pinprobe:
;    TFT ST7789 240x240  MOSI=23 SCLK=18 DC=2 RST=4  CS=tied-to-GND(-1)  BL=25(active LOW)
;    Touch button: GPIO32 (native capacitive, value drops on contact)
; ============================================================================
[env:esp32-pro]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 8MB
board_build.partitions  = default_8MB.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    bblanchon/ArduinoJson @ ^7.0.4
    tzapu/WiFiManager @ ^2.0.17
; WebServer + HTTPUpdateServer + WiFiClientSecure ship with the espressif32 core.

build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1              ; TFT_eSPI defaults this driver to SPI mode 3
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_CS=-1                   ; panel CS is hardwired to GND (do NOT drive GPIO3)
    -DTFT_BL=25
    -DTFT_BACKLIGHT_ON=LOW

    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000

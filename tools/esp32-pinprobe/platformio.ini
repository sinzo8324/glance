; ============================================================================
;  Glance pin-probe  -  GeekMagic SmallTV Pro (ESP32-WROOM-32) hardware diag
; ----------------------------------------------------------------------------
;  Purpose: verify the community-reported Pro pinout on YOUR physical unit
;  before committing pin numbers to the real firmware. It drives the TFT with
;  the candidate pins AND scans every capacitive-touch channel, reporting the
;  result three ways: on the panel itself, over Serial, and on a WiFi web page
;  at http://pinprobe.local/  (so you can read it even when flashed via the
;  stock web updater with no UART attached).
;
;  Build + flash over USB-UART (GPIO0->GND on power-up to enter flash mode):
;      pio run -e pinprobe -t upload
;  Or build only, then upload .pio/build/pinprobe/firmware.bin through the
;  stock web console "Firmware Update" page (no disassembly, fully reversible
;  -- restore the official .bin the same way if anything goes wrong):
;      pio run -e pinprobe
;
;  What to look at:
;   * Screen lights up with color bars + text  -> TFT pins/driver are correct
;   * Screen stays black                        -> wrong TFT pins or alt board
;                                                   revision; read touch over WiFi
;   * Touching the top of the case flips exactly one channel to "TOUCH"
;                                                -> that GPIO is your button
; ============================================================================

[env:pinprobe]
platform      = espressif32
board         = esp32dev              ; classic ESP32-WROOM-32 (chip_id 0x0000)
framework     = arduino
monitor_speed = 115200
upload_speed  = 460800

; 8MB flash (per the stock image header) with a dual-app OTA layout, so the
; probe can update ITSELF over WiFi. This is essential: the moment you flash
; the probe over the stock web updater, that updater is gone -- without its own
; OTA the only way to re-flash (adjust CS pin, load real firmware) is to open
; the case and wire up UART. The probe serves its own updater at /update.
board_upload.flash_size = 8MB
board_build.partitions  = default_8MB.csv

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    tzapu/WiFiManager @ ^2.0.17
; WebServer, ESPmDNS, WiFi ship with the espressif32 arduino core.

build_flags =
    ; ---- candidate TFT wiring (community-reported, HIGH confidence) ----------
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_DC=2
    -DTFT_RST=4
    -DTFT_BL=25
    -DTFT_BACKLIGHT_ON=LOW            ; Pro backlight is ACTIVE LOW
    ; CS is the UNRESOLVED pin. Default: tied to GND -> TFT_eSPI "no CS" (-1).
    ; If the screen stays black or shows garbage, comment the -1 line below and
    ; uncomment the GPIO3 line, then re-flash.
    ; -DTFT_CS=-1
    -DTFT_CS=3
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=20000000          ; conservative; Pro stock runs 20MHz
